apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelable
  namespace: argocd
spec:
  project: default
  source:
    # Ссылка на ВАШ репозиторий с инфраструктурой
    repoURL: 'https://github.com/trawwa/my-homelab-infra.git'
    targetRevision: HEAD
    path: apps/homelable
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: homelab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
